# Site do AI Jobs Radar no nginx da VPS compartilhada.
# Mesmo papel do Caddyfile: receber visitas e repassar para o container.
#
# Instalar (na VPS, com sudo):
#   sudo cp nginx-radar.conf /etc/nginx/sites-available/ai-jobs-radar
#   sudo ln -s /etc/nginx/sites-available/ai-jobs-radar /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d radar.13-140-42-86.sslip.io
#
# O certbot EDITA este arquivo na VPS: adiciona o bloco 443 com o certificado
# e o redirecionamento http → https. Diferente do Caddy, aqui o HTTPS não é
# automático — é o certbot que pede e renova (timer do systemd).

server {
    listen 80;
    # sslip.io: DNS grátis que resolve "algo.13-140-42-86.sslip.io" para o IP
    # 13.140.42.86. Dá um nome (e portanto HTTPS) sem comprar domínio.
    server_name radar.13-140-42-86.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8083;
        # Repassa ao app quem é o visitante de verdade; sem isso, todo
        # request pareceria vir de 127.0.0.1 (o próprio nginx).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O /vagas/contagem chama o Greenhouse; 30s cobre o timeout do httpx (20s).
        proxy_read_timeout 30s;
    }
}
