name: CI

# Quando rodar: em push na main e em qualquer pull request.
# Nunca confie só no "passou na minha máquina" — o CI roda num Linux limpo.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # fail-fast: false → se 3.12 quebrar, 3.13 ainda roda e você vê as duas.
      fail-fast: false
      matrix:
        # O pyproject declara requires-python >=3.12, então testamos as duas
        # versões que a promessa cobre.
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Cacheia os pacotes baixados, usando o hash do pyproject como chave.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar o projeto + dependências de dev
        # -e = editable; ".[dev]" puxa o optional-dependencies "dev"
        # (pytest + httpx). As aspas são necessárias em alguns shells.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Rodar os testes
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    # needs: só constrói imagem se os testes passaram. Não empacote código
    # que você não sabe se funciona.
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t ai-jobs-radar:ci .

      - name: Smoke test — subir o container e bater no /health
        run: |
          docker run -d --name radar -p 8000:8000 ai-jobs-radar:ci
          # O container leva um instante pra subir o uvicorn; tenta por ~30s.
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo " <- respondeu"
              exit 0
            fi
            sleep 2
          done
          echo "container nao respondeu no /health"
          docker logs radar
          exit 1

  publicar:
    runs-on: ubuntu-latest
    # Só publica se os testes E o smoke test do container passaram.
    needs: [test, docker]
    # E só a partir da main: PR não publica imagem.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      # O GITHUB_TOKEN é read-only por padrão. Sem isto, o push no ghcr falha.
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # O driver default do runner ("docker") nao sabe exportar cache.
      # Esta action cria um builder com driver "docker-container", que sabe.
      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token efêmero gerado pelo próprio Actions — nada de PAT aqui.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          # O GHCR exige nome todo minúsculo; esta action normaliza sozinha.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de camadas guardado no próprio GitHub entre execuções.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notificar:
    runs-on: ubuntu-latest
    needs: [test, docker, publicar]
    # always(): roda mesmo se algo antes falhou — é justamente quando mais
    # importa avisar. Sem isto, um teste vermelho pularia este job.
    if: always()

    steps:
      - name: Avisar no celular (ntfy)
        env:
          # O tópico do ntfy é público: quem souber o nome lê as mensagens.
          # Por isso ele é um secret do repositório, nunca texto no YAML.
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          # needs.*.result = lista com o resultado de cada job anterior.
          # "skipped" não conta como falha: em PR o publicar é pulado de propósito.
          FALHOU: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          # Valores do GitHub entram por env, não direto no script com ${{ }}:
          # assim nenhum texto controlado por terceiros vira comando de shell.
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # PR de fork não recebe secrets; sem tópico, só não avisa.
          if [ -z "$NTFY_TOPICO" ]; then
            echo "NTFY_TOPICO não definido, pulando aviso"
            exit 0
          fi

          if [ "$FALHOU" = "true" ]; then
            TITULO="AI Jobs Radar: CI FALHOU"; TAGS="x"; PRIORIDADE=4
          else
            TITULO="AI Jobs Radar: CI passou"; TAGS="white_check_mark"; PRIORIDADE=3
          fi

          # Tags viram emoji no app; Click abre o run ao tocar na notificação.
          # "|| echo": o ntfy fora do ar não deve pintar o CI de vermelho.
          curl -fsS \
            -H "Title: $TITULO" \
            -H "Tags: $TAGS" \
            -H "Priority: $PRIORIDADE" \
            -H "Click: $LINK" \
            -d "Branch $REF, commit ${SHA:0:7}" \
            "https://ntfy.sh/$NTFY_TOPICO" \
            || echo "falha ao enviar para o ntfy"
