name: CI

# Quando rodar: em push na main e em qualquer pull request.
# Nunca confie só no "passou na minha máquina" — o CI roda num Linux limpo.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # fail-fast: false → se 3.12 quebrar, 3.13 ainda roda e você vê as duas.
      fail-fast: false
      matrix:
        # O pyproject declara requires-python >=3.12, então testamos as duas
        # versões que a promessa cobre.
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Cacheia os pacotes baixados, usando o hash do pyproject como chave.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar o projeto + dependências de dev
        # -e = editable; ".[dev]" puxa o optional-dependencies "dev"
        # (pytest + httpx). As aspas são necessárias em alguns shells.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Rodar os testes
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    # needs: só constrói imagem se os testes passaram. Não empacote código
    # que você não sabe se funciona.
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t ai-jobs-radar:ci .

      - name: Smoke test — subir o container e bater no /health
        run: |
          docker run -d --name radar -p 8000:8000 ai-jobs-radar:ci
          # O container leva um instante pra subir o uvicorn; tenta por ~30s.
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo " <- respondeu"
              exit 0
            fi
            sleep 2
          done
          echo "container nao respondeu no /health"
          docker logs radar
          exit 1
